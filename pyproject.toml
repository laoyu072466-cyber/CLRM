[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clrm-verification"
version = "0.1.0"
description = "Multi-depth representation verification for LLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=4.45",
]

[tool.setuptools.packages.find]
include = ["clrm*"]
